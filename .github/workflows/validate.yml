name: validate
on: [push, pull_request]
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install framework & dependencies
        run: |
          cd framework
          pip install -e ".[dev]"
      - name: Shell syntax check
        run: bash -n custom-simulations/*/*.sh custom-simulations/lib/*.sh
      - name: Catalog schema validation (dv lint)
        run: framework/.venv/bin/dv lint || (cd framework && dv lint)
      - name: Wazuh XML rule validation (dv rules-check)
        run: framework/.venv/bin/dv rules-check || (cd framework && dv rules-check)
      - name: Python unit test suite
        run: pytest
      - name: Offline alert replay test
        run: |
          framework/.venv/bin/dv replay --alerts tests/positive/alerts_replay_sample.ndjson --technique T1059 || (cd framework && dv replay --alerts ../tests/positive/alerts_replay_sample.ndjson --technique T1059)
      - name: Generate MITRE coverage matrix artifact
        run: |
          framework/.venv/bin/dv coverage || (cd framework && dv coverage)
      - name: Upload coverage matrix artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-matrix
          path: mappings/coverage-matrix.csv
