title: Windows Domain and Trust Discovery
id: a3f7f929-7951-49b5-9d62-21dda8e56b4b
status: experimental
description: Built-in tools used to enumerate domain users, groups, trusts or directory objects.
logsource: {category: process_creation, product: windows}
detection:
  selection_net:
    Image|endswith:
      - '\net.exe'
      - '\net1.exe'
    CommandLine|contains:
      - ' view'
      - ' group '
      - ' user /domain'
      - ' accounts /domain'
  selection_trust:
    Image|endswith:
      - '\nltest.exe'
      - '\dsquery.exe'
      - '\adfind.exe'
    CommandLine|contains:
      - '/domain_trusts'
      - '/dclist'
      - 'dsquery'
      - 'adfind'
  condition: selection_net or selection_trust
level: medium
tags: [attack.discovery, attack.t1087.002, attack.t1018, attack.t1482]
