title: Reconnaissance via Whoami and Net Commands
id: f2a3b4c5-6d7e-8f9a-0b1c-2d3e4f5a6b7c
status: experimental
logsource: {category: process_creation, product: windows}
detection:
  selection:
    Image|endswith:
      - '\whoami.exe'
      - '\net.exe'
      - '\net1.exe'
      - '\systeminfo.exe'
      - '\ipconfig.exe'
    CommandLine|contains:
      - '/all'
      - 'group'
      - 'localgroup'
      - 'user'
  condition: selection
level: low
tags: [attack.discovery, attack.t1033, attack.t1082, attack.t1087]