title: Attempts to Disable Windows Defender
id: d0e1f2a3-4b5c-6d7e-8f9a-0b1c2d3e4f5a
status: experimental
logsource: {category: process_creation, product: windows}
detection:
  selection:
    Image|endswith:
      - '\powershell.exe'
      - '\cmd.exe'
      - '\reg.exe'
    CommandLine|contains:
      - 'DisableRealtimeMonitoring'
      - 'Set-MpPreference'
      - 'Windows Defender'
      - 'DisableAntiSpyware'
      - 'TamperProtection'
  condition: selection
level: high
tags: [attack.defense_evasion, attack.t1562.001]