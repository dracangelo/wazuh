title: Windows Remote Service Management via SC or WMIC
id: b281291a-bd49-40f5-927e-7fbd1057d389
status: test
description: Detects lateral movement through remote service configuration or execution.
references:
  - https://attack.mitre.org/techniques/T1569/002/
  - https://attack.mitre.org/techniques/T1021/002/
author: Antigravity Detection Team
date: 2026/11/24
tags:
  - attack.t1569.002
  - attack.t1021.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_sc:
    CommandLine|contains|all:
      - 'sc'
      - '\\\'
      - 'create'
  selection_wmic:
    CommandLine|contains|all:
      - 'wmic'
      - '/node:'
      - 'process'
      - 'call'
      - 'create'
  condition: selection_sc or selection_wmic
falsepositives:
  - Automated enterprise software management and configuration suites
level: high

