title: LSASS Memory Dumping
id: a7b8c9d0-1e2f-3a4b-5c6d-7e8f9a0b1c2d
status: experimental
logsource: {category: process_creation, product: windows}
detection:
  selection:
    Image|endswith:
      - '\procdump.exe'
      - '\procdump64.exe'
      - '\rundll32.exe'
      - '\powershell.exe'
      - '\comsvcs.dll'
    CommandLine|contains:
      - 'lsass'
      - 'MiniDump'
      - 'comsvcs.dll'
  condition: selection
level: high
tags: [attack.credential_access, attack.t1003.001]