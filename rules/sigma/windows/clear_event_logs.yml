title: Windows Event Log Cleared from the Command Line
id: 555e1991-831e-4615-ac3d-89ca1648ceab
status: experimental
description: wevtutil or PowerShell cmdlets used to clear or remove Windows event logs.
logsource: {category: process_creation, product: windows}
detection:
  selection_wevtutil:
    Image|endswith: '\wevtutil.exe'
    CommandLine|contains:
      - 'cl '
      - 'clear-log'
  selection_powershell:
    CommandLine|contains:
      - 'Clear-EventLog'
      - 'Remove-EventLog'
  condition: selection_wevtutil or selection_powershell
level: high
tags: [attack.defense_evasion, attack.t1070.001]
