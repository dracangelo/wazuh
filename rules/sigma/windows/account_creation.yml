title: Local User Account Created
id: c9d0e1f2-3a4b-5c6d-7e8f-9a0b1c2d3e4f
status: experimental
logsource: {category: process_creation, product: windows}
detection:
  selection:
    Image|endswith:
      - '\net.exe'
      - '\net1.exe'
      - '\powershell.exe'
    CommandLine|contains:
      - 'user /add'
      - 'New-LocalUser'
      - 'net user '
  condition: selection
level: medium
tags: [attack.persistence, attack.t1136.001]