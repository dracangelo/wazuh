title: Windows Remote Session or Remote Command Execution
id: 16945f07-ab43-429a-8d02-7f44ec35c6a9
status: experimental
description: winrs, RDP or WinRM host processes used to start a session or run a remote command.
logsource: {category: process_creation, product: windows}
detection:
  selection_tools:
    Image|endswith:
      - '\winrs.exe'
      - '\mstsc.exe'
  selection_winrm:
    Image|endswith: '\wsmprovhost.exe'
  condition: selection_tools or selection_winrm
level: medium
tags: [attack.lateral_movement, attack.t1021.001, attack.t1021.006]
