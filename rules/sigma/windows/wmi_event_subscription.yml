title: WMI Event Subscription for Persistence
id: b8c9d0e1-2f3a-4b5c-6d7e-8f9a0b1c2d3e
status: experimental
logsource: {category: process_creation, product: windows}
detection:
  selection:
    Image|endswith:
      - '\wmic.exe'
      - '\powershell.exe'
    CommandLine|contains:
      - 'EventFilter'
      - '__EventFilter'
      - 'CommandLineEventConsumer'
      - 'ActiveScriptEventConsumer'
      - 'Binding'
  condition: selection
level: high
tags: [attack.persistence, attack.t1546.003]