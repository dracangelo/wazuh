title: Windows Network Service Scanning via Portqry or Test-NetConnection
id: 5002ebbb-3dd2-40cc-9298-a05466ef46fe
status: test
description: Detects network reconnaissance and port scanning using native or diagnostic tools on Windows.
references:
  - https://attack.mitre.org/techniques/T1046/
author: Antigravity Detection Team
date: 2026/11/24
tags:
  - attack.t1046
logsource:
  category: process_creation
  product: windows
detection:
  selection_portqry:
    Image|endswith: '\portqry.exe'
  selection_tnc:
    CommandLine|contains|all:
      - 'Test-NetConnection'
      - '-Port'
  condition: selection_portqry or selection_tnc
falsepositives:
  - Legitimate network troubleshooting by network engineers
level: medium

