title: Linux Firewall Disabling or Flush
id: 45b98510-490e-4ddc-9423-1031f59b11b8
status: test
description: Detects commands that flush iptables rules or disable the ufw host firewall.
references:
  - https://attack.mitre.org/techniques/T1562/004/
author: Antigravity Detection Team
date: 2026/11/24
tags:
  - attack.t1562.004
logsource:
  category: process_creation
  product: linux
detection:
  selection_iptables:
    CommandLine|contains:
      - 'iptables -F'
      - 'iptables --flush'
      - 'iptables -X'
      - 'ip6tables -F'
      - 'nft flush ruleset'
  selection_ufw:
    CommandLine|contains:
      - 'ufw disable'
      - 'ufw reset'
  condition: selection_iptables or selection_ufw
falsepositives:
  - Firewall administration and network configuration updates
level: high

