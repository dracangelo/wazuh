title: Linux Process Memory Dumping via /proc/kcore or gcore
id: a52fb09e-0a25-4bfc-9670-fcc8895e8f6d
status: test
description: Detects reading of raw kernel memory or invoking process dumping tools to extract credentials.
references:
  - https://attack.mitre.org/techniques/T1003/007/
author: Antigravity Detection Team
date: 2026/11/24
tags:
  - attack.t1003.007
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    CommandLine|contains:
      - '/proc/kcore'
      - 'gcore '
      - 'dump-guest-memory'
  condition: selection
falsepositives:
  - Kernel crash debugging by system administrators
level: high

