attack_technique: T1136.001
display_name: "Create Account: Local Account"
atomic_tests:
  - name: Create a user account on a Linux system
    auto_generated_guid: 40d8eabd-e394-46f6-8785-b9bfa1d011d2
    description: >-
      Creates a locally-scoped user and removes it afterwards. The account name is unique per
      execution and the command refuses to run if that name already exists, so a pre-existing
      account is never modified or deleted.
    supported_platforms: [linux]
    input_arguments:
      username:
        description: Username of the account to create (must not already exist)
        type: string
        default: dv_atomic_user
    executor:
      name: bash
      elevation_required: true
      command: |
        set -u
        if getent passwd #{username} >/dev/null 2>&1; then
          echo "refusing: account #{username} already exists" >&2
          exit 75
        fi
        sudo -n useradd -M -N -r -s /bin/bash -c "dv test account #{dv_exec_id}" #{username}
      cleanup_command: |
        set -u
        # Only remove the account this execution created: its GECOS comment carries the exec id.
        if [ "$(getent passwd #{username} | cut -d: -f5)" = "dv test account #{dv_exec_id}" ]; then
          sudo -n userdel #{username}
        fi
