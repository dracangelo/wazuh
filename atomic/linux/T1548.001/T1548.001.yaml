attack_technique: T1548.001
display_name: "Abuse Elevation Control Mechanism: Setuid and Setgid"
atomic_tests:
  - name: Set the setuid bit on a temporary copy of true
    auto_generated_guid: c4a7e9f0-2b18-4d63-8e51-9f0a1b2c3d4e
    description: >-
      Copies /bin/true to a unique path in /tmp and sets the setuid bit. The file is removed by
      cleanup_command even if the test is interrupted; the real system binaries are not changed.
      Detection comes from the auditd setuid watch (rule 100421) and/or FIM (100320, 100321).
    supported_platforms: [linux]
    executor:
      name: bash
      elevation_required: false
      command: |
        set -u
        f="/tmp/dv_atomic_suid_#{dv_exec_id}"
        cp "$(command -v true)" "$f"
        chmod u+s "$f"
      cleanup_command: |
        rm -f "/tmp/dv_atomic_suid_#{dv_exec_id}"
