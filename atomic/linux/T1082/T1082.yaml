attack_technique: T1082
display_name: "System Information Discovery"
atomic_tests:
  - name: Discover system information on Linux
    auto_generated_guid: 2d9f7a44-3c1b-4e58-8f60-a7b2c9d1e034
    description: >-
      Collects basic host information with read-only commands. This is intentionally below the
      recon-burst threshold so a single command must not raise rule 100409.
    supported_platforms: [linux]
    executor:
      name: bash
      elevation_required: false
      command: |
        set -u
        uname -a
        cat /etc/os-release 2>/dev/null || true
