attack_technique: T1070.003
display_name: "Indicator Removal: Clear Command History"
atomic_tests:
  - name: Remove a command-history file from a temporary directory
    auto_generated_guid: b8e1c5d2-4a63-4f09-9d7e-1c2b3a4f5e60
    description: >-
      Creates and removes a file named .bash_history inside a unique temporary directory. It does
      not touch the real shell history; cleanup_command removes the directory if the test is
      interrupted. Rule 100407 matches the removal.
    supported_platforms: [linux]
    executor:
      name: bash
      elevation_required: false
      command: |
        set -u
        f="/tmp/dv_atomic_history_#{dv_exec_id}/.bash_history"
        mkdir -p "$(dirname "$f")"
        : >"$f"
        rm -f "$f"
      cleanup_command: |
        rm -rf "/tmp/dv_atomic_history_#{dv_exec_id}"
