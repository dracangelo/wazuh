attack_technique: T1548.003
display_name: "Abuse Elevation Control Mechanism: Sudo and Sudo Caching"
atomic_tests:
  - name: Enumerate sudo privileges
    auto_generated_guid: 1b7d2e4f-9c3a-4f6e-8a52-0d9e1c3b5a77
    description: >-
      Runs sudo -l to list the caller's permitted commands. This is read-only; rule 100417 detects
      the enumeration when auditd records the sudo execution.
    supported_platforms: [linux]
    executor:
      name: bash
      elevation_required: false
      command: |
        set -u
        sudo -n -l 2>/dev/null || true
