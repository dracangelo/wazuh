attack_technique: T1574.006
display_name: "Hijack Execution Flow: Dynamic Linker Hijacking"
atomic_tests:
  - name: Run a command with LD_PRELOAD set
    auto_generated_guid: 6c1f0f7a-2d4b-4a58-9d3e-7b6c5a4f3e21
    description: >-
      Sets LD_PRELOAD to the system libc while running /bin/true. Nothing is created or changed;
      rule 100414 detects the environment assignment recorded by auditd.
    supported_platforms: [linux]
    executor:
      name: bash
      elevation_required: false
      command: |
        set -u
        env LD_PRELOAD=/lib/x86_64-linux-gnu/libc.so.6 /bin/true
