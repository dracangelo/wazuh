attack_technique: T1564.004
display_name: "Hide Artifacts: NTFS File Attributes"
atomic_tests:
  - name: Create an alternate data stream on a temporary file
    auto_generated_guid: 3656d3d5-db20-4fe0-b39c-d8c06b412fbf
    description: >-
      Creates a uniquely named temporary file with one alternate data stream. Sysmon event 15 feeds
      rule 100876; the cleanup removes the host file and with it the stream.
    supported_platforms: [windows]
    executor:
      name: powershell
      elevation_required: false
      command: |
        $f = Join-Path $env:TEMP "dv_atomic_ads_#{dv_exec_id}.txt"
        Set-Content -Path $f -Value "dv"
        Set-Content -Path "$f:dvstream" -Value "dv_atomic"
      cleanup_command: |
        Remove-Item -Path (Join-Path $env:TEMP "dv_atomic_ads_#{dv_exec_id}.txt") -Force -ErrorAction SilentlyContinue
