attack_technique: T1087.001
display_name: "Account Discovery: Local Account"
atomic_tests:
  - name: Enumerate local users and groups
    auto_generated_guid: 555e1991-831e-4615-ac3d-89ca1648ceab
    description: >-
      Read-only local account enumeration. Sysmon 1 records net.exe and whoami.exe; rule 100873
      matches the account-query form of net user.
    supported_platforms: [windows]
    executor:
      name: powershell
      elevation_required: false
      command: |
        net user
        whoami /groups
