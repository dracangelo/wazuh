tests:
  - id: NET-SURICATA-COBALT-STRIKE
    name: Suricata IDS detection of Cobalt Strike beaconing
    technique: T1071.001
    platform: linux
    source: custom
    target: lab-linux-01
    tags: [network, ids, suricata]
    simulation:
      script: network/pcap_replay.sh
      interpreter: bash
      args: [cobalt_strike]
    expected:
      rule_ids: ["100651"]
      timeout_seconds: 45

  - id: NET-SURICATA-SLIVER-C2
