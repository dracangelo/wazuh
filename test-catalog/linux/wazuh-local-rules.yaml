# One test per custom rule in rules/wazuh/linux. Rules needing auditd/FIM assume the
# agent-config/ snippets are installed. Negative tests prove thresholds don't over-trigger.
tests:
- id: LIN-R100401
  name: Binary executed from /tmp
  technique: T1059.004
  platform: linux
  source: custom
  target: lab-linux-01
  tags:
  - rules
  simulation:
    script: rules-lab/scenarios.sh
    interpreter: bash
    args:
    - exec_tmp
  expected:
    rule_ids:
    - '100401'
    timeout_seconds: 60
- id: LIN-R100401-NEG
  name: Normal binary exec must not alert
  technique: T1059.004
  platform: linux
  source: custom
  target: lab-linux-01
  tags:
  - rules
  simulation:
    script: rules-lab/scenarios.sh
    interpreter: bash
    args:
    - benign_exec
  expected:
    rule_ids:
    - '100401'
    timeout_seconds: 45
  negative: true
