tests:
  - id: CLOUD-AWS-ROOT-LOGIN
    name: AWS CloudTrail root console login without MFA
    technique: T1078.004
    platform: linux
    source: custom
    target: lab-linux-01
    tags: [cloud, aws]
    simulation:
      script: cloud/cloud_anomaly_sim.sh
      interpreter: bash
      args: [aws_root_login]
    expected:
      rule_ids: ["100610"]
      timeout_seconds: 45

  - id: CLOUD-AWS-STOP-TRAIL
