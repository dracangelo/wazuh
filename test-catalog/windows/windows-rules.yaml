# Windows catalog: smoke markers first, then rules with benign, self-cleaning simulations.
# All custom Windows simulations set prelude: false because dv_safety.sh is bash.
tests:
- id: WIN-MARK-APP
  name: Application-log canary reaches Wazuh
  technique: MARKER
  platform: windows
  source: custom
  target: lab-win-01
  tags: [smoke, marker]
  simulation:
    script: windows/validation_app.ps1
    interpreter: powershell
    prelude: false
  expected:
    rule_ids: ['100700']
    timeout_seconds: 90

