[project]
name = "detection-validator"
version = "0.1.0"
description = "Validate Wazuh/Sigma detection rules against Atomic Red Team and custom simulations"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "requests>=2.31"]

[project.optional-dependencies]
pdf = ["reportlab>=4"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
dv = "validator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["../tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# Pin the rule set so lint results do not change when ruff's defaults do.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
